services:
  db: # use this to connect: docker exec -it postgres_db psql -U postgres -d test
    image: postgres:18.4
    container_name: postgres_db # specify a container name
    restart: unless-stopped # auto restart if crash
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # ports:
      # 5433:5432 # only expose port when something outside of compose needs to reach this

volumes:
  postgres_data:
